# netlify.toml — Thanotectas
# Sitio HTML estático con funciones serverless

[build]
  publish = "."
  command = "node build-pages.mjs"

[functions]
  node_bundler = "esbuild"

[functions."capsula-diaria"]
  schedule = "0 14 * * *"
  included_files = [
    "node_modules/@resvg/resvg-wasm/index_bg.wasm",
    "node_modules/@fontsource/cormorant-garamond/files/cormorant-garamond-latin-400-italic.woff",
    "node_modules/@fontsource/jost/files/jost-latin-300-normal.woff",
    "node_modules/@fontsource/jost/files/jost-latin-600-normal.woff"
  ]

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; connect-src 'self' https://oygwnmfwfxbxdogaqwmi.supabase.co https://script.google.com; img-src 'self' data: blob: https://oygwnmfwfxbxdogaqwmi.supabase.co; frame-src https://checkout.bold.co; object-src 'none'; base-uri 'self'"
